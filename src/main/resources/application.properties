spring.application.name=transit-tracker

transit.poll-interval=15s
# Static schedule (stop_times) reload; also loaded once at startup
transit.static-refresh-interval=24h
# Second scheduler thread so a schedule load never delays a vehicle poll
spring.task.scheduling.pool.size=2
transit.feeds[0].agency-id=goraleigh
transit.feeds[0].vehicle-positions-url=https://www.goraleighlive.org/gtfsrt/vehicles
transit.feeds[0].trip-updates-url=https://www.goraleighlive.org/gtfsrt/trips
transit.feeds[0].static-gtfs-url=https://goraleigh.org/gr_gtfs
transit.feeds[1].agency-id=godurham
transit.feeds[1].vehicle-positions-url=https://godurham.rideralerts.com/InfoPoint/GTFS-Realtime.ashx?Type=VehiclePosition
transit.feeds[1].trip-updates-url=https://godurham.rideralerts.com/InfoPoint/GTFS-Realtime.ashx?Type=TripUpdate
transit.feeds[1].static-gtfs-url=https://godurham.rideralerts.com/InfoPoint/GTFS-Zip.ashx
transit.feeds[2].agency-id=gotriangle
transit.feeds[2].vehicle-positions-url=https://gotriangle.tripsparkhost.com/gtfs/Realtime/GTFS_VehiclePositions.pb
transit.feeds[2].trip-updates-url=https://gotriangle.tripsparkhost.com/gtfs/Realtime/GTFS_TripUpdates.pb
transit.feeds[2].static-gtfs-url=https://gotriangle.org/gtfs
transit.feeds[3].agency-id=chapelhill
transit.feeds[3].vehicle-positions-url=https://mychtransit.org/gtfs-rt/vehiclepositions
transit.feeds[3].trip-updates-url=https://mychtransit.org/gtfs-rt/tripupdates
transit.feeds[3].static-gtfs-url=https://mychtransit.org/gtfs
transit.feeds[4].agency-id=gocary
transit.feeds[4].vehicle-positions-url=https://www.gocarylive.org/GTFS/Realtime/GTFS_VehiclePositions.pb
transit.feeds[4].trip-updates-url=https://www.gocarylive.org/GTFS/Realtime/GTFS_TripUpdates.pb
# https://gocary.org/_GTFS redirects to plain http, which the client refuses to follow; this is its https target
transit.feeds[4].static-gtfs-url=https://gocary.org/wp-content/uploads/gocarygtfs.zip

# Local-dev defaults (compose Postgres on localhost); overridden by SPRING_DATASOURCE_* in containers
spring.datasource.url=jdbc:postgresql://localhost:5432/transit
spring.datasource.username=transit
spring.datasource.password=transit
# Sends JDBC batches as multi-row INSERTs (schedule load is ~500k rows)
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
