spring.application.name=transit-tracker

transit.poll-interval=15s
transit.feed.agency-id=goraleigh
transit.feed.vehicle-positions-url=https://www.goraleighlive.org/gtfsrt/vehicles

# Local-dev defaults (compose Postgres on localhost); overridden by SPRING_DATASOURCE_* in containers
spring.datasource.url=jdbc:postgresql://localhost:5432/transit
spring.datasource.username=transit
spring.datasource.password=transit
